<header class="app-header">
  <h1>{{ title }}</h1>

  @if (!isLoggedIn) {
    <button (click)="login()">Iniciar sesión con Microsoft</button>
  } @else {
    <div class="user-info">
      <span>Hola, {{ userName }}</span>
      <button (click)="logout()">Cerrar sesión</button>
    </div>
  }
</header>

<main>
  @if (isLoggedIn) {
    <router-outlet />
  } @else {
    <p>Inicia sesión para ver el contenido de NexoraMarket.</p>
  }
</main>
